name: Sync with upstream

on:
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync-compiler:
    runs-on: ubuntu-latest
    environment: upstream-sync

    env:
      GH_TOKEN: ${{ secrets.SYNC_TOKEN }}
      SUBMODULE: refal-05
      PREFIX: compiler-sync

    steps:
    - name: Check that the sync token is present
      run: |
        if [ -z "$GH_TOKEN" ]; then
          echo "::error::Secret SYNC_TOKEN is not set. A fine-grained PAT is required: pull requests opened with GITHUB_TOKEN do not trigger workflows, so their required checks would never run."
          exit 1
        fi

    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        submodules: recursive
        token: ${{ secrets.SYNC_TOKEN }}

    - name: Configure git identity
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

    - name: Decide whether the submodule moved
      id: decide
      run: |
        git submodule update --remote --quiet "$SUBMODULE"
        if git diff --quiet -- "$SUBMODULE"; then
          echo "proceed=false" >> "$GITHUB_OUTPUT"
          echo "$SUBMODULE is already at its latest commit, nothing to do"
          exit 0
        fi
        ALREADY_OPEN=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open \
          --json headRefName --jq "[.[] | select(.headRefName | startswith(\"$PREFIX/\"))] | length")
        if [ "$ALREADY_OPEN" -ne 0 ]; then
          echo "proceed=false" >> "$GITHUB_OUTPUT"
          echo "A $PREFIX pull request is already open, not opening another one"
          exit 0
        fi
        echo "proceed=true" >> "$GITHUB_OUTPUT"
        echo "sha=$(git -C "$SUBMODULE" rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

    - name: Bootstrap against the new revision
      if: steps.decide.outputs.proceed == 'true'
      run: |
        cp refal-05/lib/c-plus-plus.conf.sh.template c-plus-plus.conf.sh
        if ! make bin/refal05c; then
          echo "::error::Bootstrap failed against the new $SUBMODULE revision. Usually upstream renamed or split modules, so the module lists in src/standalone-bootstrap.sh and src/standalone-bootstrap.cmd need updating by hand."
          exit 1
        fi

    - name: Commit the bump and the regenerated artifacts
      if: steps.decide.outputs.proceed == 'true'
      run: |
        git checkout -b "$PREFIX/${{ steps.decide.outputs.sha }}"
        git add "$SUBMODULE" bootstrap
        git commit -m "Компилятор поднят до ${{ steps.decide.outputs.sha }}, артефакты bootstrap/ перегенерированы"

    - name: Push and open a pull request
      if: steps.decide.outputs.proceed == 'true'
      run: |
        BRANCH="$PREFIX/${{ steps.decide.outputs.sha }}"
        git push -u origin "$BRANCH"
        cat > /tmp/body.md <<'BODY'
        Автоматическое обновление компилятора [Mazdaywik/Refal-05](https://github.com/Mazdaywik/Refal-05).

        Раскрутка против новой ревизии прошла, артефакты `bootstrap/` перегенерированы.

        PR будет влит автоматически, когда пройдут обе проверки CI, включая проверку неподвижной точки.
        BODY
        gh pr create --repo "$GITHUB_REPOSITORY" --base master --head "$BRANCH" \
          --title "Компилятор поднят до ${{ steps.decide.outputs.sha }}" \
          --body-file /tmp/body.md
        gh pr merge --repo "$GITHUB_REPOSITORY" "$BRANCH" --auto --merge

  sync-framework:
    runs-on: ubuntu-latest
    environment: upstream-sync

    env:
      GH_TOKEN: ${{ secrets.SYNC_TOKEN }}
      SUBMODULE: refal-5-framework
      PREFIX: framework-sync

    steps:
    - name: Check that the sync token is present
      run: |
        if [ -z "$GH_TOKEN" ]; then
          echo "::error::Secret SYNC_TOKEN is not set."
          exit 1
        fi

    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        submodules: recursive
        token: ${{ secrets.SYNC_TOKEN }}

    - name: Configure git identity
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

    - name: Decide whether the submodule moved
      id: decide
      run: |
        git submodule update --remote --quiet "$SUBMODULE"
        if git diff --quiet -- "$SUBMODULE"; then
          echo "proceed=false" >> "$GITHUB_OUTPUT"
          echo "$SUBMODULE is already at its latest commit, nothing to do"
          exit 0
        fi
        ALREADY_OPEN=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open \
          --json headRefName --jq "[.[] | select(.headRefName | startswith(\"$PREFIX/\"))] | length")
        if [ "$ALREADY_OPEN" -ne 0 ]; then
          echo "proceed=false" >> "$GITHUB_OUTPUT"
          echo "A $PREFIX pull request is already open, not opening another one"
          exit 0
        fi
        echo "proceed=true" >> "$GITHUB_OUTPUT"
        echo "sha=$(git -C "$SUBMODULE" rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

    - name: Bootstrap against the new revision
      if: steps.decide.outputs.proceed == 'true'
      run: |
        cp refal-05/lib/c-plus-plus.conf.sh.template c-plus-plus.conf.sh
        if ! make bin/refal05c; then
          echo "::error::Bootstrap failed against the new $SUBMODULE revision. The framework changed something the compiler relies on; this needs a human."
          exit 1
        fi

    - name: Commit the bump and the regenerated artifacts
      if: steps.decide.outputs.proceed == 'true'
      run: |
        git checkout -b "$PREFIX/${{ steps.decide.outputs.sha }}"
        git add "$SUBMODULE" bootstrap
        git commit -m "Фреймворк поднят до ${{ steps.decide.outputs.sha }}, артефакты bootstrap/ перегенерированы"

    - name: Push and open a pull request
      if: steps.decide.outputs.proceed == 'true'
      run: |
        BRANCH="$PREFIX/${{ steps.decide.outputs.sha }}"
        git push -u origin "$BRANCH"
        cat > /tmp/body.md <<'BODY'
        Автоматическое обновление [Рефал-5-фреймворка](https://github.com/Mazdaywik/refal-5-framework).

        Раскрутка против новой ревизии прошла, артефакты `bootstrap/` перегенерированы.

        PR будет влит автоматически, когда пройдут обе проверки CI, включая проверку неподвижной точки.
        BODY
        gh pr create --repo "$GITHUB_REPOSITORY" --base master --head "$BRANCH" \
          --title "Фреймворк поднят до ${{ steps.decide.outputs.sha }}" \
          --body-file /tmp/body.md
        gh pr merge --repo "$GITHUB_REPOSITORY" "$BRANCH" --auto --merge
