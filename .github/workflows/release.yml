name: Release

on:
  # Каждое изменение master: если для закреплённой ревизии refal-05 релиза ещё нет, он выпускается, иначе запуск тихо завершается.
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish. Leave empty to use the newest upstream commit contained in master.'
        required: false
        type: string

permissions:
  contents: write

# Два слияния подряд не должны наперегонки публиковать один и тот же тег.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.pick.outputs.tag }}
      publish: ${{ steps.pick.outputs.publish }}

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Pick the tag
      id: pick
      run: |
        if [ -n "${{ inputs.tag }}" ]; then
          TAG="${{ inputs.tag }}"
        else
          TAG=$(git -C refal-05 rev-parse --short HEAD)
        fi
        echo "Tag to publish: $TAG"
        echo "tag=$TAG" >> "$GITHUB_OUTPUT"
        if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            # Обычный случай: слияние не меняло ревизию компилятора. Это не ошибка, письма о сбое быть не должно.
            echo "Release $TAG already exists, nothing to publish."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "::error::Release $TAG already exists. Pass an explicit tag input to publish another one."
          exit 1
        fi
        echo "publish=true" >> "$GITHUB_OUTPUT"
      env:
        GH_TOKEN: ${{ github.token }}

  build-linux:
    needs: tag
    if: needs.tag.outputs.publish == 'true'
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Bootstrap and test with the default configuration
      run: make bin/refal05c

    - name: Rebuild the compiler with release flags
      run: |
        gcc -O2 -s -static -Ibootstrap -o bin/refal05c bootstrap/*.c
        file bin/refal05c
        ls -l bin/refal05c

    - name: Test the release binary
      run: ./scripts/autotests.sh

    - name: Upload the release binary
      uses: actions/upload-artifact@v4
      with:
        name: release-linux
        path: bin/refal05c

  build-windows:
    needs: tag
    if: needs.tag.outputs.publish == 'true'
    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Configure compiler
      shell: cmd
      run: |
        echo @echo off > c-plus-plus.conf.cmd
        echo set R05CCOMP=cl /TC /W3 /wd4996 /O2 /MT >> c-plus-plus.conf.cmd

    - name: Bootstrap and test
      shell: cmd
      run: |
        set "VSWHERE=C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe"
        if not exist "%VSWHERE%" (
          echo ERROR: vswhere.exe not found at "%VSWHERE%"
          exit /b 1
        )
        set "VCVARS="
        for /f "usebackq tokens=*" %%i in (`"%VSWHERE%" -latest -products * -find VC\Auxiliary\Build\vcvars64.bat`) do set "VCVARS=%%i"
        if not defined VCVARS (
          echo ERROR: no Visual Studio installation with the C++ toolset found on this image
          exit /b 1
        )
        call "%VCVARS%"
        if errorlevel 1 exit /b 1
        scripts\bootstrap.cmd

    - name: Upload the release binary
      uses: actions/upload-artifact@v4
      with:
        name: release-windows
        path: bin/refal05c.exe

  publish:
    needs: [tag, build-linux, build-windows]
    if: needs.tag.outputs.publish == 'true'
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Download the binaries
      uses: actions/download-artifact@v4
      with:
        path: artifacts

    - name: Lay the distributives out
      run: |
        TAG="${{ needs.tag.outputs.tag }}"
        chmod +x artifacts/release-linux/refal05c
        scripts/dist.sh "$TAG" linux-x86_64 artifacts/release-linux/refal05c
        scripts/dist.sh "$TAG" windows-x64 artifacts/release-windows/refal05c.exe
        # Имена архивов без тега, чтобы работала постоянная ссылка releases/latest/download/<имя>.
        # Внутри обоих архивов один каталог refal05c, тег лежит в файле VERSION.
        tar -czf dist/refal05c-linux-x86_64.tar.gz -C dist/linux-x86_64 refal05c
        (cd dist/windows-x64 && zip -qr ../refal05c-windows-x64.zip refal05c)
        ls -lR dist

    - name: Write the release notes
      run: |
        cat > notes.md <<'NOTES'
        Сборка компилятора, соответствующая коммиту TAG_PLACEHOLDER оригинального репозитория
        [Mazdaywik/Refal-05](https://github.com/Mazdaywik/Refal-05).

        | архив | платформа |
        |---|---|
        | `refal05c-linux-x86_64.tar.gz` | Linux x86-64, статическая сборка, зависимостей от glibc нет |
        | `refal05c-windows-x64.zip` | Windows x64, статический CRT, Visual C++ Redistributable не нужен |

        В каждом архиве каталог `refal05c`, в нём `bin` с компилятором и `lib` с рантаймом и Рефал-5-фреймворком.
        Для работы достаточно указать путь к `lib` в переменной `R05PATH`.

        Обе сборки оптимизированы и проходят автотесты.
        NOTES
        sed -i "s/TAG_PLACEHOLDER/${{ needs.tag.outputs.tag }}/g" notes.md
        cat notes.md

    - name: Publish
      run: |
        gh release create "${{ needs.tag.outputs.tag }}" \
          --repo "$GITHUB_REPOSITORY" \
          --target "$GITHUB_SHA" \
          --title "${{ needs.tag.outputs.tag }}" \
          --notes-file notes.md \
          dist/*.tar.gz dist/*.zip
      env:
        GH_TOKEN: ${{ github.token }}
