name: Build Refal-05

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Build Refal-05 compiler
      run: make bin/refal05c

    - name: Verify compiler was built
      run: |
        test -f bin/refal05c || (echo "Compiler binary not found!" && exit 1)
        ls -lh bin/refal05c

    - name: Verify bootstrap fixpoint
      # The bootstrap rewrote bootstrap/ in place, so the reference is the commit under test:
      # every one of its eleven files must come back byte for byte, and nothing new may appear.
      run: |
        if ! git diff --exit-code -- bootstrap; then
          echo "::error::Bootstrap is not a fixpoint: the committed bootstrap/ differs from what the build regenerates"
          exit 1
        fi
        UNTRACKED=$(git status --porcelain -- bootstrap)
        if [ -n "$UNTRACKED" ]; then
          echo "$UNTRACKED"
          echo "::error::Bootstrap is not a fixpoint: the build left files in bootstrap/ that are not committed"
          exit 1
        fi
        echo "Bootstrap is a fixpoint: the build reproduces the committed bootstrap/ byte for byte"

    - name: Upload compiler binary
      uses: actions/upload-artifact@v4
      with:
        name: refal05-linux
        path: bin/refal05c
        retention-days: 90

    - name: Upload bootstrap artifacts
      uses: actions/upload-artifact@v4
      with:
        name: bootstrap-artifacts-linux
        path: bootstrap/
        retention-days: 90

    - name: Display build information
      run: |
        echo "Build completed successfully!"
        echo "Compiler: bin/refal05c"
        echo "Bootstrap artifacts in: bootstrap/"
        ls -lh bootstrap/

  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Configure compiler
      shell: cmd
      run: |
        echo @echo off > c-plus-plus.conf.cmd
        echo set R05CCOMP=cl /TC /W3 /wd4996 /O2 >> c-plus-plus.conf.cmd

    - name: Build Refal-05 compiler
      shell: cmd
      run: |
        set "VSWHERE=C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe"
        if not exist "%VSWHERE%" (
          echo ERROR: vswhere.exe not found at "%VSWHERE%"
          exit /b 1
        )
        set "VCVARS="
        for /f "usebackq tokens=*" %%i in (`"%VSWHERE%" -latest -products * -find VC\Auxiliary\Build\vcvars64.bat`) do set "VCVARS=%%i"
        if not defined VCVARS (
          echo ERROR: no Visual Studio installation with the C++ toolset found on this image
          exit /b 1
        )
        echo Using %VCVARS%
        call "%VCVARS%"
        if errorlevel 1 exit /b 1
        scripts\bootstrap.cmd

    - name: Verify compiler was built
      run: |
        if (!(Test-Path bin\refal05c.exe)) {
          Write-Error "Compiler binary not found!"
          exit 1
        }
        Get-Item bin\refal05c.exe

    - name: Upload compiler binary
      uses: actions/upload-artifact@v4
      with:
        name: refal05-windows
        path: bin/refal05c.exe
        retention-days: 90

    - name: Upload bootstrap artifacts
      uses: actions/upload-artifact@v4
      with:
        name: bootstrap-artifacts-windows
        path: bootstrap/
        retention-days: 90

    - name: Display build information
      run: |
        echo "Build completed successfully!"
        echo "Compiler: bin\refal05c.exe"
        echo "Bootstrap artifacts in: bootstrap\"
        Get-ChildItem bootstrap\
